name: Documentation navigation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check coverage, links and generated tree
        run: python scripts/project_docs.py --check
      - name: Install exported-schema dependencies
        run: python -m pip install -e .
      - name: Check exported settings schemas and defaults
        run: python scripts/settings_docs.py --check
