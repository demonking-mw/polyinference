[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polyinference"
version = "0.1.0"
description = "Portable LangGraph coding agent with a bounded local orchestration OS"
requires-python = ">=3.10"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite==3.1.2",
  "httpx==0.28.1",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
polyinference = "polyinference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.setuptools.package-data]
polyinference = ["ui.html", "ui-monitor.js"]
